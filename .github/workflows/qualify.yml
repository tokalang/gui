name: GUI package qualification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOKA_VERSION: v1.0.0-rc.4
  TOKA_ASSET: toka-v1.0.0-rc.4-macos-arm64.tar.gz
  TOKA_ASSET_SHA256: f5e9043af6f650bca42e95d22fda28c6814413faa4bf9478decfeb884d4d0866

jobs:
  qualify:
    name: Standalone package qualification (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: brew install lld@20 zstd openssl@3

      - name: Install locked Toka SDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$TOKA_ASSET"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/$TOKA_ASSET"
          echo "$TOKA_ASSET_SHA256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${TOKA_ASSET%.tar.gz}"
          test -x "$sdk/bin/toka"
          test -x "$sdk/bin/tokac"
          test -f "$sdk/lib/sys/toka_rt.o"
          test -f "$sdk/lib/toolchain/toka_build.py"
          test -f "$sdk/lib/toolchain/toka_package.py"
          "$sdk/bin/toka" --version | grep -F '1.0.0-rc.4'
          "$sdk/bin/tokac" --version | grep -F '1.0.0-rc.4'
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"

      - name: Verify macOS frameworks
        run: |
          set -euo pipefail
          sdk_path="$(xcrun --show-sdk-path)"
          test -d "$sdk_path/System/Library/Frameworks/AppKit.framework"
          test -d "$sdk_path/System/Library/Frameworks/Metal.framework"
          test -d "$sdk_path/System/Library/Frameworks/QuartzCore.framework"

      - name: Build and qualify the exact release archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gui-0.1.0.tar.gz"
          package_root="$RUNNER_TEMP/gui-0.1.0"
          python3 tools/build_release.py --output "$archive"
          mkdir "$package_root"
          tar -xzf "$archive" -C "$package_root"
          cd "$package_root"
          python3 tests/qualify_package.py
